<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up/in Page</title>
</head>

<body>
    <header>
        Eye Exam Sign Up/Sign In
    </header>

    <video autoplay muted loop id="bgVideo"
        src="Videos/White letters on black screen background full HD.... - Gopal Creation (720p).mp4">
    </video>


    <div class="signUp">
        <h1>Sign Up</h1>
        <input type="text" id="username" placeholder="Username">
        <br><input type="text" id="password" placeholder="Password">
        <p id="error"></p>
        <br><button id="signUp" onclick="SignUp()">Sign Up</button>
        <p id="success"></p>
        <div class="signInSwitch">
            <p>Already have an account?</p>
            <button id="switch" onclick="switchIn()">Sign In</button>
        </div>
    </div>


    <div class="signIn">
        <h1>Sign In</h1>
        <input type="text" id="usernameIn" placeholder="Username">
        <br><input type="text" id="passwordIn" placeholder="Password">
        <p id="errorIn"></p>
        <br><button id="signUp" onclick="SignIn()">Sign In</button>
        <br>
        <div class="signUpSwitch">
            <p>Don't have an account?</p>
            <button id="switch" onclick="switchUp()">Sign Up Today</button>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
